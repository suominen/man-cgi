# Origin-only smoke checklist: Surrogate headers are visible only
# before Fastly (it strips them toward clients), so run this against
# the QA vhost or the origin directly:
#
#   ct-check --scheme http --server man.oxygene.qa.nxrns.org \
#       --file tests/smoke-origin.yml

checklist:

- path: /
  headers:
    surrogate-control: "max-age=86400, stale-while-revalidate=3600"
    surrogate-key: "all home coll:NetBSD-current"

- path: /ls.1
  headers:
    surrogate-control: "max-age=86400, stale-while-revalidate=3600, stale-if-error=604800"
    surrogate-key: "all coll:NetBSD-current page:NetBSD-current:ls.1"

# MI page under an arch URL now 301s to the arch-less canonical
# URL, keyed as a redirect.
- path: /i386/ls.1
  code: 301
  headers:
    surrogate-key: "all redirect coll:NetBSD-current"

# A machine-dependent page served under its own arch keeps the arch
# key. (Depends on apm(4) staying i386-only.)
- path: /i386/apm.4
  headers:
    surrogate-key: "all coll:NetBSD-current page:NetBSD-current:apm.4 arch:i386"

# A machine-class page served under its class directory (man4/x86).
# (Depends on est(4) staying in man4/x86.)
- path: /x86/est.4
  headers:
    surrogate-key: "all coll:NetBSD-current page:NetBSD-current:est.4 arch:x86"

- path: /NetBSD-10.1/ls.1
  headers:
    surrogate-control: "max-age=7776000, stale-while-revalidate=86400, stale-if-error=604800"
    surrogate-key: "all coll:NetBSD-10.1 page:NetBSD-10.1:ls.1"

# API list objects keep the form key (the lists live here now).
- path: /api/v1/archlist
  type: text/plain
  headers:
    surrogate-key: "all api form archlist"

# 404s revalidate at the origin (nginx's benefit; Fastly does not
# 304 cached 404s toward clients).
- path: /qqzz-smoke-nonesuch.1
  code: 404
  headers:
    surrogate-control: "max-age=86400, stale-if-error=86400"
    surrogate-key: "all notfound coll:NetBSD-current"
  revalidate: true

- path: /ls
  code: 301
  headers:
    surrogate-control: "max-age=2592000"
    surrogate-key: "all redirect coll:NetBSD-current"

- path: /.well-known/health
  headers:
    surrogate-control: "max-age=30"
    surrogate-key: "all"
