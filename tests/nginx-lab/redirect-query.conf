# The redirect block of sites-available/man.netbsd.org's location /,
# after the rejection blocks: a query string on a page path or on /
# is not the site's (tracking parameters other sites append), so the
# request is sent to its own path without it. Included by
# drive-reject into location / only; keep in step with the vhost.

if ($args) {
    add_header Surrogate-Key "all redirect nginx-redirect" always;
    return 301 $raw_path;
}
