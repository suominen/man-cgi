# The rejection blocks of sites-available/man.netbsd.org, in the
# order the vhost has them, included into both of the lab's entry
# locations by drive-reject. Keep in step with the vhost (and with
# mancgi.j2 once the Ansible port lands): this file is what the
# lab measures, so a change to one without the other measures the
# wrong thing.

if ($probe_path) {
    add_header Surrogate-Key "all notfound nginx-reject" always;
    return 404;
}

if ($man_bad_uri) {
    add_header Surrogate-Key "all notfound nginx-reject" always;
    return 404;
}

if ($man_bad_method) {
    add_header Allow "GET, HEAD" always;
    return 405;
}

if ($man_bad_query) {
    return 400;
}

if ($qs_error) {
    return 400;
}
