# Test-fixture man.conf, modeled on the production configuration
# (BSD.2 format; nroff is always used so historical man-macro pages
# render the same way as mdoc pages).

_version	BSD.2

# Subdirectories for paths ending in '/', IN SEARCH ORDER.
_subdir		cat1 man1 cat8 man8 cat6 man6 cat2 man2 cat3 man3 cat3lua man3lua cat4 man4 cat5 man5 cat7 man7 man3f cat9 man9 cat9lua man9lua

# Files typed by suffix and their commands.
_suffix		.0
_build		.[1-9][a-z]*	/usr/bin/nroff -msafer -man %s
_build		.[1-9ln]	/usr/bin/nroff -msafer -man %s

# The CGI always sets MANPATH to the collection directory, so the
# default path is never used; point it somewhere empty.
_default	/nonexistent/

# Specific section/directory combinations.
1		{cat,man}1
2		{cat,man}2
3		{cat,man}3
3f		{cat,man}3f
3lua		{cat,man}3lua
4		{cat,man}4
5		{cat,man}5
6		{cat,man}6
7		{cat,man}7
8		{cat,man}8
9		{cat,man}9
9lua		{cat,man}9lua

# Machine classes per machine.
_i386		x86
_amd64		x86
