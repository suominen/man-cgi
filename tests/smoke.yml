# Smoke checklist for man.netbsd.org, usable against any tier:
#
#   ct-check --scheme https --server man.netbsd.org \
#       --delay 1 --file tests/smoke.yml
#   ct-check --scheme http --server man.oxygene.qa.nxrns.org \
#       --delay 1 --file tests/smoke.yml
#
# Always pace the requests (--delay): the QA vhost is uncached, so
# every request lands on the fcgiwrap workers shared with production.
#
# Asserts only what holds everywhere; Surrogate headers are stripped
# by Fastly, so their checks live in smoke-origin.yml.
#
# Rare flake: during Fastly's stale-while-revalidate window right
# after a rebuild, a revalidate entry can compare a stale object's
# Last-Modified against the refreshed one and report a spurious 200.
# Re-run before believing such a failure.

checklist:

# Home page.
- path: /
  type: text/html
  headers:
    cache-control: "public, max-age=3600"
    last-modified: present
  revalidate: true

# Current-collection page (the default collection).
- path: /ls.1
  type: text/html
  headers:
    cache-control: "public, max-age=3600"
    last-modified: present
  revalidate: true

# Machine-dependent page under its arch.
- path: /i386/apm.4
  type: text/html
  headers:
    cache-control: "public, max-age=3600"
    last-modified: present

# MI page under an arch URL 301s to the arch-less canonical URL.
- path: /i386/ls.1
  code: 301
  location: /ls.1
  headers:
    cache-control: "public, max-age=3600"

# Release-collection page. (Release trees are never retired, so this
# entry outlives the branch one below.)
- path: /NetBSD-10.1/ls.1
  type: text/html
  headers:
    cache-control: "public, max-age=3600"
    last-modified: present
  revalidate: true

# Collection index (ADR-0017): the home page scoped to a release,
# and the slash-less form canonicalizing to it.
- path: /NetBSD-10.1/
  type: text/html
  headers:
    cache-control: "public, max-age=3600"
    last-modified: present
  revalidate: true

- path: /NetBSD-10.1
  code: 301
  location: /NetBSD-10.1/
  headers:
    cache-control: "public, max-age=3600"

# An architecture with no page name goes to the collection's index.
- path: /i386/
  code: 301
  location: /
  headers:
    cache-control: "public, max-age=3600"

# Branch-collection page. (Dies when the 11 branch is retired -
# runbook, "Collection retirement procedure" - update to the next
# branch first.)
- path: /NetBSD-11.x-BRANCH/ls.1
  type: text/html
  headers:
    cache-control: "public, max-age=3600"

# 404 with a validator. No revalidate here: Fastly answers
# conditionals with 304 only for cached 200s, so through Fastly a
# conditional 404 request gets the full 404 (the origin-side 304 is
# checked in smoke-origin.yml).
- path: /qqzz-smoke-nonesuch.1
  code: 404
  headers:
    cache-control: "public, max-age=3600"
    last-modified: present

# Sectionless request canonicalizes permanently.
- path: /ls
  code: 301
  location: /ls.1
  headers:
    cache-control: "public, max-age=3600"

# Legacy query-string URL canonicalizes permanently.
- path: /cgi-bin/man-cgi?ls+1
  code: 301
  location: /ls.1

# A collection name that is not one is a 404, not a redirect into
# another collection. Query-string form only: the path parser takes
# a collection only from an [A-Z]* component.
- path: /cgi-bin/man-cgi?ls+1+..
  code: 404
  headers:
    cache-control: "public, max-age=3600"
    last-modified: present

# An architecture that is not one names nothing, so it is a 404
# rather than a guess at which page was meant.
- path: /cgi-bin/man-cgi?ls+..
  code: 404
  headers:
    cache-control: "public, max-age=3600"
    last-modified: present

# A name that is not one is a 404. ct-check (urllib) sends the < raw,
# as the report that found <b>zz in the <h1> was made. Since
# ADR-0020 nginx's grammar map answers this before the CGI (no
# validator, no CGI Cache-Control); the CGI's own handling of such a
# name is checked by the test suite.
- path: /<b>zz
  code: 404

# A name with a * in it is a 404 whatever fcgiwrap's working
# directory holds: the request words are no longer pathname-expanded
# before the sanitizer sees them (man-cgi 1.113, set -f). Since
# ADR-0020 the grammar map refuses the * first, so this pins only
# that nothing serves it; the decoy-based proof is tests/t/globbing.
- path: /ls*
  code: 404

# The same * in the legacy query form is off the query grammar:
# refused by the site query map (ADR-0020) with a 400.
- path: /cgi-bin/man-cgi?ls*+1
  code: 400

# Request rejection (ADR-0020): probes, off-grammar shapes and
# off-grammar query strings are answered by nginx without reaching
# the CGI. A 404 here carries no CGI validator.
- path: /wp-login.php
  code: 404

- path: /.env
  code: 404

- path: /sitemap.xml
  code: 404

- path: /ls.1;id
  code: 404

- path: /?a%20and%20b
  code: 400

# The legacy query form lives at /cgi-bin/man-cgi only; any other
# query string on / or a page path is sent to the path without it
# (other sites' tracking parameters arrive that way).
- path: /?ls+1
  code: 301
  location: /

# Path info is what the / rewrite produces; arriving with it is
# refused.
- path: /cgi-bin/man-cgi/ls.1
  code: 404

- path: /?rest_route=/batch/v1
  code: 400

# Shapes the grammar map must keep letting through: a + in the name,
# a sectionless name with a dot in it, tracking parameters on a page.
- path: /g++.1
  type: text/html
  headers:
    cache-control: "public, max-age=3600"
    last-modified: present

- path: /nsswitch.conf
  code: 301
  location: /nsswitch.conf.5

- path: /ls.1?utm_source=smoke
  code: 301
  location: /ls.1

# A real architecture that ships no pages of its own in the
# collection is still a real architecture: archlist is the union
# across every collection and membership is the test, not whether
# this collection has a directory for it. Resolves to the
# machine-independent page and canonicalizes to it (ADR-0009).
# (pc532 is retired and has no directory in NetBSD-current; any
# other archlist entry in that position does just as well.)
- path: /pc532/ls.1
  code: 301
  location: /ls.1

# A .0 release that never existed falls back to current.
- path: /NetBSD-99.0/ls.1
  code: 302
  location: /ls.1
  headers:
    cache-control: "public, max-age=3600"

# API list endpoints.
- path: /api/v1/archlist
  type: text/plain
  headers:
    cache-control: "public, max-age=3600"
    last-modified: present
  revalidate: true

- path: /api/v1/sectlist
  type: text/plain
  headers:
    cache-control: "public, max-age=3600"
    last-modified: present

- path: /api/v1/nosuch
  code: 404

# Health check.
- path: /.well-known/health
  type: text/plain
  headers:
    cache-control: "public, max-age=30"
    x-powered-by: present
